name = "msta-lp"
# next-on-pages の edge 関数は node:async_hooks (AsyncLocalStorage) を要求する。
# nodejs_compat でこれらが提供されるのは compatibility_date >= 2024-09-23 のみ。
# 古い日付だと edge 動的ルートが "No such module async_hooks" で 500 になる。
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pages settings
pages_build_output_dir = ".vercel/output/static"

# CMS コンテンツ格納用 KV。公開ページはリクエスト時に KV を読み、
# /admin の保存が push やビルドなしで即座に反映される。
[[kv_namespaces]]
binding = "CMS_KV"
id = "8f26118b07fe4928bc412dc18179049e"

